project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - admin/prerequisites.qmd
    - admin/workshop_overview.qmd
    - slides/day1.qmd
    - slides/day2.qmd
    - booklet/index.qmd
    - booklet/day1.qmd
    - booklet/day2.qmd
    - data/dictionary.qmd
    - materials/exercises/index.qmd
    - materials/sources.qmd
    - materials/rubric.qmd
    - materials/solutions.qmd
    - materials/results.qmd
    - admin/instructor.qmd
  resources:
    - "!work/**"
    - "!renv/**"
    - "!.claude/**"
    - "!submissions/**"
    - styles/fonts/**
    - data/processed/*.csv
    - data/raw/*.json
    - data/reference/*.csv
    - code/*.R
    - materials/templates/*.md
    - materials/examples/*.md
    - results/*.svg
    - results/*.csv
    - downloads/*.zip
    - downloads/EIZ-prirucnik.pdf
website:
  title: "AI u istraživanju"
  site-url: https://lusiki.github.io/EIZ-radionica/
  search: true
  navbar:
    background: light
    title: "EIZ / radionica"
    left:
      - href: admin/prerequisites.qmd
        text: Početak
      - href: slides/day1.qmd
        text: Dan 1
      - href: slides/day2.qmd
        text: Dan 2
      - href: materials/exercises/index.qmd
        text: Primjeri
      - href: booklet/index.qmd
        text: Priručnik
      - text: Za dalje
        menu:
          - href: data/dictionary.qmd
            text: Podaci
          - href: materials/sources.qmd
            text: Izvori
          - href: materials/results.qmd
            text: Cijela analiza
          - href: materials/rubric.qmd
            text: Završni razgovor
          - href: admin/instructor.qmd
            text: Kako voditi radionicu
  page-footer:
    left: "Ekonomski institut, Zagreb · Materijali radionice"
    right:
      - href: admin/workshop_overview.qmd
        text: Put kroz radionicu
lang: hr
format:
  html:
    theme: [default, styles/custom.scss]
    css: styles/fonts.css
    toc: true
    toc-title: "Na ovoj stranici"
    toc-depth: 2
    code-copy: true
    code-overflow: wrap
    highlight-style: styles/statistika.theme
    grid:
      body-width: 760px
      margin-width: 220px
    anchor-sections: true
    link-external-newwindow: true
execute:
  enabled: false
