# =====================================================================
#  design-tokens.yml — JEDINI IZVOR ISTINE ZA DIZAJN (design single source of truth)
# =====================================================================
#  Ovdje se mijenja izgled knjige. Sve ostalo (SCSS, LaTeX, R grafovi)
#  preslikava ove vrijednosti i provjerava se skriptom:
#
#      Rscript scripts/check_design.R
#
#  Postupak zamjene dizajna opisan je u DESIGN.md.
#
#  ZAŠTO NIJE _brand.yml. Quarto ima vlastiti brand sloj koji čita _brand.yml
#  i sam ubacuje SCSS varijable i pisma. Ovdje se namjerno ne koristi: njegova
#  se shema mijenja s inačicama Quarta, prihvaća samo dio onoga što nam treba
#  i uvodi drugi put kojim boja može ući u stranicu. Ova je datoteka obični
#  YAML koji čitaju R tema grafova i scripts/check-tokens.R, a stil se u
#  cijelosti gradi iz styles/custom.scss.
#
#  IDENTITET: „Zvono". Bauhausovska geometrija korice 02 Zvono: kupola
#  normalne raspodjele nad osnovicom, disk s brojem, tanka os, mala slova
#  u displejnom registru. Isti sustav objavljen je kao Claude Design System
#  „Sustav Zvono"; puna specifikacija je u DESIGN.md.
#
#  PET NAČELA KOJA OVE VRIJEDNOSTI NOSE
#    1. Oblik nosi značenje: kupola, disk, os, osnovica.
#    2. Boja je posao. Oker znači dodir, modra gradi pojam, crvena
#       označava grešku. Nijedna nije ukras u čitateljskoj zoni.
#    3. Crno-bijelo prvo. Tiskani blok je jednobojan.
#    4. Brojke su monospace, tabularne i verzalne.
#    5. Mjera prije širine: redak teksta nikad šire od 66 znakova.
#
#  DVIJE ZONE. Naslovna zona (korica, naslovna stranica, stranica dijela)
#  troši paletu kao velika polja i koristi brand-* tokene koji se ne mijenjaju
#  s temom. Čitateljska zona (poglavlje, widget, tisak) troši boju samo kao
#  ulogu.
# =====================================================================

meta:
  name: "EIZ radionica / Mint & Slate"
  link: https://lusiki.github.io/EIZ-radionica/

color:
  palette:
    # --- površine ---------------------------------------------------
    paper:        "#F5F8F7"   # token:paper        stranica — hladna svijetla podloga
    paper-soft:   "#E5EFEC"   # token:paper-soft   uvučene plohe: sažetak, kod, ploča widgeta
    surface:      "#FFFFFF"   # token:surface      površina crtanja u widgetu, oblačić pojma
    # --- tekst ------------------------------------------------------
    ink:          "#18343B"   # token:ink          naslovi, osnovice, disk s brojem
    ink-soft:     "#29454A"   # token:ink-soft     tijelo teksta
    ink-mute:     "#456268"   # token:ink-mute     sekundarno
    ink-faint:    "#526E73"   # token:ink-faint    potpisi, izvori
    # --- vlas linije (strukturne, ne izvedene iz tinte) -------------
    rule:         "#A9C1BA"   # token:rule         strukturna vlas linija
    rule-soft:    "#D0E0DA"   # token:rule-soft    meka vlas linija
    # --- akcent: OKER. Samo dodir i navođenje. -----------------------
    accent:       "#A9D9C7"   # token:accent       ispuna gumba, palac klizača, aktivna stavka
    on-accent:    "#18343B"   # token:on-accent    tekst i rub na okeru
    accent-deep:  "#176653"   # token:accent-deep  tekst poveznice
    accent-dark:  "#104839"   # token:accent-dark  prijelaz mišem, posjećeno
    accent-wash:  "#DBF0E7"   # token:accent-wash  odabir, kod u retku, bljesak promjene
    # --- modra: POJAM ------------------------------------------------
    concept:      "#245A79"   # token:concept      os definicije, kupola vinjete, pojam
    # --- crvena: GREŠKA ----------------------------------------------
    error:        "#BA493E"   # token:error        znak i crta okvira Nađite grešku
    alert:        "#94382F"   # token:alert        tekst pogreške, pogreška u izlazu koda
    # --- paleta podataka --------------------------------------------
    # Poredana po SVJETLINI da preživi pretvorbu u sivo: tiskani blok je
    # jednobojan i ovih pet tonova u njemu postaju pet razlučivih sivih.
    # Treba li serija više od pet razina, mijenja se oblik točke ili
    # uzorak ispune — nikad ton. Oker i crvena nisu boje podataka.
    data-1:       "#18343B"   # token:data-1        tinta
    data-2:       "#245A79"   # token:data-2        modra
    data-3:       "#687766"   # token:data-3        maslinastosiva
    data-4:       "#9CAA9D"   # token:data-4        sivozelena
    data-5:       "#D5DDD4"   # token:data-5        blijeda kadulja
    # --- naslovna zona: iste vrijednosti u obje teme ------------------
    brand-mustard: "#A9D9C7"  # token:brand-mustard  podloga korice i naslovne stranice
    brand-navy:    "#245A79"  # token:brand-navy     vanjska kupola
    brand-cream:   "#F5F8F7"  # token:brand-cream    srednja kupola, tekst na tamnom polju
    brand-red:     "#BA493E"  # token:brand-red      unutarnja kupola
    brand-ink:     "#18343B"  # token:brand-ink      naslov, disk, os i osnovica na okeru

  foreground: ink-soft
  background: paper
  primary: accent-deep
  secondary: ink-mute
  success: accent-deep
  info: concept
  warning: accent
  danger: alert

typography:
  # Tri obitelji, sve s punom Latin Extended-A podrškom (č ć đ š ž).
  # Web ih učitava iz styles/head.html; PDF i R grafovi učitavaju statičke
  # instance iz fonts/print/ (vidi tex/theme.tex i R/theme_book.R).

  # Displej: korica, naslov poglavlja i dijela. Malim slovima, rez 400.
  display:
    family: "Jost, Futura, 'Century Gothic', sans-serif"              # token-font:display
    weight: 400
    tracking: -0.01em

  # Tijelo teksta.
  base:
    family: "Literata, Georgia, serif"                                # token-font:serif
    size: 1.0625rem      # 17 px zaslon; 10,5 pt / 14,5 pt u tisku
    line-height: 1.62

  # Naslovi odjeljaka: Jost 500, rečenično pismo.
  headings:
    family: "Jost, Futura, 'Century Gothic', sans-serif"
    weight: 500
    color: ink

  # Kod, brojke, oznake widgeta. Ligature ISKLJUČENE — vidi DESIGN.md.
  monospace:
    family: "'JetBrains Mono', ui-monospace, SFMono-Regular, monospace"  # token-font:mono
    size: 0.8125rem

# UI / sans registar (sučelje, potpisi, margina, izvori, glave tablica).
ui-font:
  family: "Jost, Futura, 'Century Gothic', sans-serif"                # token-font:sans
  size: 0.8125rem

# Mjera, crte i ritam.
layout:
  measure: 66ch          # stupac teksta nikad širi od 66 znakova
  radius: 0px            # pravi kut; krug i kupola su oblici, ne zaobljenja
  rule-width: 2px        # os: gornja crta okvira, spoj diska i naslova
  definition-width: 4px  # lijeva os definicije
  heading-width: 3px     # crta iznad naslova odjeljka
  baseline-width: 6px    # osnovica: vrh ploče widgeta, dno naslovne zone
  body-width: 680px
  margin-width: 260px
  touch-target: 44px
